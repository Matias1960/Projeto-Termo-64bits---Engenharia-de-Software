<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TERMO 64-BIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt-overlay"></div>

    <div id="tela-inicio">
        <h1 class="pixel-title">TERMO 64</h1>
        <button class="btn-idioma" data-lang="pt">PORTUGUÊS</button>
        <button class="btn-idioma" data-lang="en">ENGLISH</button>
    </div>

    <div id="tela-jogo" style="display: none;">
        <div class="instrucoes" id="msg-instr"></div>
        
        <div class="stats-container">
            <span>SCORE:<span id="score-val">0</span></span>
            <span>RD:<span id="round-val">1</span></span>
        </div>
        
        <div class="grid" id="board"></div>
    </div>

    <script src="models/model.js"></script>
    <script src="views/wordleView.js"></script>
    <script src="controllers/controller.js"></script>
    <script>
        const app = new WordleController(new WordleModel(), new WordleView());
    </script>
</body>
</html>
